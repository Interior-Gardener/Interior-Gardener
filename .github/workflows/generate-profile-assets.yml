name: Generate Profile Assets (Stats & Snake)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=0F172A&color_dots=#F1F5F9,#CBD5E1,#94A3B8,#64748B,#334155
            dist/github-snake-dark.svg?color_snake=22D3EE&color_dots=#0A101F,#1E293B,#334155,#475569,#64748B&color_empty=#0A101F
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout github-readme-stats
        uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          path: stats-app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Static GitHub Stats
        run: |
          # Go to the local stats app and install dependencies
          cd stats-app
          npm ci
          
          # Start the express server locally in the background
          node express.js &
          
          # Wait for server to become ready (max 15 seconds)
          timeout 15 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:9000/api)" != "200" ]]; do sleep 1; done'
          
          # Return to root and prepare output directory
          cd ..
          mkdir -p dist
          
          echo "Fetching Stats SVG..."
          curl -s -f "http://localhost:9000/api?username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&hide_rank=true&hide_border=true&title_color=22D3EE&icon_color=A78BFA&text_color=94A3B8&bg_color=0A101F&card_width=500" -o dist/stats.svg
          
          echo "Fetching Top Languages SVG..."
          curl -s -f "http://localhost:9000/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&title_color=22D3EE&text_color=94A3B8&bg_color=0A101F&card_width=500" -o dist/top-langs.svg

          echo "Validating generated SVGs..."
          if grep -q "Something went wrong" dist/stats.svg dist/top-langs.svg; then
            echo "Error: github-readme-stats generated an error SVG instead of valid stats."
            echo "This usually means the GitHub user does not exist or the STATS_TOKEN is invalid/missing."
            exit 1
          fi

          if [ ! -s dist/stats.svg ] || [ ! -s dist/top-langs.svg ]; then
            echo "Error: Generated SVGs are empty."
            exit 1
          fi
          
          echo "Static assets successfully generated."
        env:
          PAT_1: ${{ secrets.STATS_TOKEN }}

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
