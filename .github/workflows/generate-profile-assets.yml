name: Generate Profile Assets (Stats & Snake)

on:
  schedule:
    # Deliberately off the hour: 00:00 UTC is GitHub's most congested slot and
    # scheduled runs there are frequently delayed or dropped entirely.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-profile-assets.yml"

# Only one refresh at a time; a queued run supersedes a stuck one.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      # Seed dist/ with whatever is already published. If a generator fails
      # today, the previous good asset survives instead of disappearing from
      # the README.
      - name: Seed dist from the published output branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: output
          path: previous

      - name: Prepare dist
        run: |
          mkdir -p dist
          if [ -d previous ]; then
            find previous -maxdepth 1 -name '*.svg' -exec cp {} dist/ \;
          fi
          ls -la dist || true

      # STATS_TOKEN (repo scope) is passed here too so the contribution
      # calendar includes private contributions. The default GITHUB_TOKEN only
      # ever sees the public graph.
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.STATS_TOKEN || github.token }}
          outputs: |
            snake-out/github-snake.svg?color_snake=0F172A&color_dots=#F1F5F9,#CBD5E1,#94A3B8,#64748B,#334155
            snake-out/github-snake-dark.svg?color_snake=22D3EE&color_dots=#0A101F,#1E293B,#334155,#475569,#64748B&color_empty=#0A101F

      - name: Stage snake output
        run: |
          sudo chown -R "$(id -un)":"$(id -gn)" snake-out
          for f in github-snake.svg github-snake-dark.svg; do
            if [ ! -s "snake-out/$f" ]; then
              echo "::error::snake-out/$f was not generated."
              exit 1
            fi
            cp "snake-out/$f" "dist/$f"
            echo "Staged $f ($(wc -c < "dist/$f") bytes)"
          done

      - name: Verify STATS_TOKEN is configured
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::Repository secret STATS_TOKEN is not set."
            echo "Add it under Settings > Secrets and variables > Actions > New repository secret."
            echo "Name it exactly STATS_TOKEN and use a classic PAT with the 'repo' scope."
            exit 1
          fi
          echo "STATS_TOKEN is present."

      - name: Checkout github-readme-stats
        uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          path: stats-app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Static GitHub Stats
        env:
          # github-readme-stats reads its tokens from PAT_1, PAT_2, ...
          PAT_1: ${{ secrets.STATS_TOKEN }}
          USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          cd stats-app
          npm ci
          node express.js &
          timeout 30 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" localhost:9000/api)" = "200" ]; do sleep 1; done'
          cd ..

          mkdir -p staged

          fetch() {
            name="$1"; url="$2"
            echo "Fetching $name ..."
            if ! curl -f -sS "$url" -o "staged/$name"; then
              echo "::error::curl failed while downloading $name"
              return 1
            fi
            if [ ! -s "staged/$name" ]; then
              echo "::error::$name is empty."
              return 1
            fi
            if grep -q "Something went wrong" "staged/$name"; then
              echo "::error::github-readme-stats returned an error card for $name."
              echo "STATS_TOKEN is most likely expired, revoked, or missing the 'repo' scope."
              head -c 600 "staged/$name"
              return 1
            fi
            echo "$name OK ($(wc -c < "staged/$name") bytes)"
          }

          fetch stats.svg "http://localhost:9000/api?username=${USER}&show_icons=true&count_private=true&include_all_commits=true&hide_rank=true&hide_border=true&title_color=22D3EE&icon_color=A78BFA&text_color=94A3B8&bg_color=0A101F&card_width=500"
          fetch top-langs.svg "http://localhost:9000/api/top-langs/?username=${USER}&layout=compact&langs_count=8&hide_border=true&title_color=22D3EE&text_color=94A3B8&bg_color=0A101F&card_width=500"

          cp staged/stats.svg staged/top-langs.svg dist/
          echo "Stats staged into dist/."

      # Runs even if the stats step failed, so a broken stats card can never
      # take the freshly generated snake down with it.
      - name: Push to Output Branch
        if: always()
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
